<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Support Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            /* Indigo */
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --chat-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --user-msg-bg: #4F46E5;
            --user-msg-text: #FFFFFF;
            --ai-msg-bg: #F1F5F9;
            --ai-msg-text: #1E293B;
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            max-height: 800px;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .chat-header {
            background: var(--chat-bg);
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .chat-header p {
            margin: 6px 0 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .chatbox {
            flex-grow: 1;
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper.user {
            align-self: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
        }

        .message {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message p {
            margin: 0 0 8px 0;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message.user {
            background: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: var(--ai-msg-bg);
            color: var(--ai-msg-text);
            border-bottom-left-radius: 4px;
        }

        /* Markdown styles inside AI msg */
        .message.ai pre {
            background: #E2E8F0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
        }

        .message.ai code {
            font-family: monospace;
            background: #E2E8F0;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .message.ai ul,
        .message.ai ol {
            margin-top: 8px;
            margin-bottom: 8px;
            padding-left: 20px;
        }

        .loading {
            align-self: flex-start;
            padding: 14px 18px;
            background: var(--ai-msg-bg);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            box-sizing: border-box;
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #94A3B8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .suggestions {
            padding: 0 20px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-chip {
            background: var(--chat-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            background: var(--bg-color);
            border-color: #CBD5E1;
        }

        .input-area {
            padding: 16px 20px;
            background: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex-grow: 1;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 28px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .input-area input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .input-area button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .input-area button:disabled {
            background: #CBD5E1;
            cursor: not-allowed;
            transform: none;
        }

        .input-area button:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .input-area button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-left: 2px;
        }

        .meta-info {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
            margin-left: 4px;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>GenAI Assistant</h2>
            <p>Ask me anything about your settings & account</p>
        </div>

        <div class="chatbox" id="chatbox">
            <div class="message-wrapper ai">
                <div class="message ai">
                    <p>Hello! How can I help you today?</p>
                </div>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            <div class="suggestion-chip" onclick="ask(this)">Reset my password</div>
            <div class="suggestion-chip" onclick="ask(this)">Create an account</div>
            <div class="suggestion-chip" onclick="ask(this)">Contact support</div>
            <div class="suggestion-chip" onclick="ask(this)">Update my profile</div>
            <div class="suggestion-chip" onclick="ask(this)">Delete my account</div>
            <div class="suggestion-chip" onclick="ask(this)">Enable 2FA</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Message assistant..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Configure Marked.js for secure and clean Markdown parsing
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: false
        });

        // Session Management
        function getSessionId() {
            let sessionId = localStorage.getItem("chatSessionId");
            if (!sessionId) {
                sessionId = "sess_" + Math.random().toString(36).substring(2, 15);
                localStorage.setItem("chatSessionId", sessionId);
            }
            return sessionId;
        }

        const sessionId = getSessionId();

        function ask(el) {
            document.getElementById("userInput").value = el.innerText;
            sendMessage();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            let input = document.getElementById("userInput");
            let message = input.value.trim();
            let btn = document.getElementById("sendBtn");

            if (message === "") return;

            let chat = document.getElementById("chatbox");

            // Add user message to UI
            const userMsgWrapper = document.createElement('div');
            userMsgWrapper.className = 'message-wrapper user';

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = message; // Safe text
            userMsgWrapper.appendChild(userMsg);
            chat.appendChild(userMsgWrapper);

            // Clear input
            input.value = "";
            input.disabled = true;
            btn.disabled = true;

            // Add Loading Indicator
            let loadingWrapper = document.createElement('div');
            loadingWrapper.className = 'message-wrapper ai';
            loadingWrapper.id = 'loading';

            let loadingMsg = document.createElement('div');
            loadingMsg.className = 'loading typing-indicator';
            loadingMsg.innerHTML = '<span></span><span></span><span></span>';

            loadingWrapper.appendChild(loadingMsg);
            chat.appendChild(loadingWrapper);

            chat.scrollTop = chat.scrollHeight;

            // Fetch API
            fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: message,
                    sessionId: sessionId
                })
            })
                .then(res => res.json())
                .then(data => {
                    // Remove loading
                    chat.removeChild(document.getElementById('loading'));

                    // Re-enable inputs
                    input.disabled = false;
                    btn.disabled = false;
                    input.focus();

                    // Add AI response to UI
                    const aiMsgWrapper = document.createElement('div');
                    aiMsgWrapper.className = 'message-wrapper ai';

                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message ai';

                    // Render markdown using Marked.js
                    aiMsg.innerHTML = marked.parse(data.reply);

                    aiMsgWrapper.appendChild(aiMsg);

                    // Add meta info (tokens, retrieved chunks)
                    if (data.tokensUsed !== undefined) {
                        const meta = document.createElement('div');
                        meta.className = 'meta-info';
                        meta.innerText = `Tokens: ${data.tokensUsed} | Chunks retrieved: ${data.retrievedChunks}`;
                        aiMsgWrapper.appendChild(meta);
                    }

                    chat.appendChild(aiMsgWrapper);
                    chat.scrollTop = chat.scrollHeight;

                })
                .catch(err => {
                    chat.removeChild(document.getElementById('loading'));
                    input.disabled = false;
                    btn.disabled = false;

                    const aiMsgWrapper = document.createElement('div');
                    aiMsgWrapper.className = 'message-wrapper ai';

                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'message ai';
                    errorMsg.style.color = '#DC2626';
                    errorMsg.style.background = '#FEE2E2';
                    errorMsg.textContent = 'Sorry, there was a network error communicating with the server.';

                    aiMsgWrapper.appendChild(errorMsg);
                    chat.appendChild(aiMsgWrapper);
                    chat.scrollTop = chat.scrollHeight;
                });
        }
    </script>

</body>

</html>
